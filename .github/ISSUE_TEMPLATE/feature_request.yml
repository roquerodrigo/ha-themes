---
name: "Feature request"
description: "Suggest an improvement to a theme, a new theme or a new feature"
labels: ["enhancement"]
body:
- type: markdown
  attributes:
    value: Before you open a new feature request, search the [existing feature requests](../../issues?q=is%3Aissue+label%3Aenhancement) to see if others have had the same idea.
- type: dropdown
  attributes:
    label: "Theme"
    description: "The theme the request is about."
    options:
      - Anthropic
      - Anthropic System UI
      - All themes
      - A new theme
      - Not theme-specific
  validations:
    required: true
- type: textarea
  attributes:
    label: "Is your feature request related to a problem? Please describe."
    description: "A clear and concise description of what the problem is."
    placeholder: "I'm always frustrated when [...]"
  validations:
    required: true
- type: textarea
  attributes:
    label: "Describe the solution you'd like"
    description: "A clear and concise description of what you want to happen."
  validations:
    required: true
- type: textarea
  attributes:
    label: "Describe alternatives you've considered"
    description: "Any alternative solutions or features you've considered."
- type: textarea
  attributes:
    label: "Additional context"
    description: "Screenshots, mockups or references that illustrate the request."
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: This contains only one feature request (open one request for each idea).
        required: true
      - label: I searched the existing feature requests and this is not a duplicate.
        required: true
