---
name: "Bug report"
description: "Report a visual problem with a theme or a problem with the integration"
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: Before you open a new issue, search the [existing bug reports](../../issues?q=is%3Aissue+label%3Abug) to see if others have had the same problem.
- type: dropdown
  attributes:
    label: "Theme"
    description: "The theme that shows the problem."
    options:
      - Anthropic
      - Anthropic System UI
      - All themes
      - Not theme-specific (installation, setup or repair issue)
  validations:
    required: true
- type: dropdown
  attributes:
    label: "Mode"
    description: "The light/dark mode in which the problem appears."
    options:
      - Light
      - Dark
      - Both
      - Not applicable
  validations:
    required: true
- type: input
  attributes:
    label: "Browser or app"
    description: "Browser and version, or the Home Assistant Companion app and platform."
    placeholder: "Chrome 141 on macOS, Companion app 2026.9 on Android"
  validations:
    required: true
- type: input
  attributes:
    label: "Home Assistant version"
    description: "Settings → About."
    placeholder: "2026.9.4"
  validations:
    required: true
- type: input
  attributes:
    label: "HA Themes version"
    description: "HACS → HA Themes."
    placeholder: "0.1.0"
  validations:
    required: true
- type: textarea
  attributes:
    label: "Describe the issue"
    description: "What you see, what you expected, and where it happens (page, dialog or card type)."
  validations:
    required: true
- type: textarea
  attributes:
    label: "Screenshots"
    description: "For visual problems, attach a screenshot with the theme and, if possible, the same view with the default Home Assistant theme for comparison."
- type: textarea
  attributes:
    label: "Reproduction steps"
    value: |
      1.
      2.
      3.
      ...
  validations:
    required: true
- type: textarea
  attributes:
    label: "Logs"
    description: "For installation, setup or repair problems, paste the relevant lines from the Home Assistant log (Settings → System → Logs) or attach the diagnostics dump of the integration (see https://www.home-assistant.io/integrations/diagnostics/)."
    render: text
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: This issue contains only one problem (open one issue for each problem).
        required: true
      - label: I searched the existing issues and this is not a duplicate.
        required: true
