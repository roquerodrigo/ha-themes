name: High Contrast Glacier
description: >-
  A test fixture, not a shipped theme: near-black and white planes, cold blue accents and
  opaque borders, to keep the builder honest for themes far from the Anthropic one.
backdrop_blur: false

palette:
  primary: "#3d8bff"
  neutral:
    "05": "#000000"
    "10": "#070b12"
    "20": "#111826"
    "30": "#1f2a3d"
    "40": "#3a4760"
    "50": "#5b6a86"
    "60": "#8796b1"
    "70": "#b2bfd6"
    "80": "#d3dcec"
    "90": "#e9eef7"
    "95": "#f6f8fc"
  red:
    seed: "#ff4d5e"
    "05": "#2a0a0e"
    "10": "#3d0f15"
    "20": "#5c1620"
    "30": "#7d1d2a"
  orange:
    seed: "#ffab2e"
    "05": "#2a1a05"
    "10": "#3d2607"
    "20": "#5a380a"
    "30": "#7a4c0d"
  green:
    seed: "#2fd18b"
    "05": "#062618"
    "10": "#093822"
    "20": "#0e5233"
    "30": "#136e44"
  cyan: "#3fd4ff"

roles:
  light:
    background: "#ffffff"
    surface: "#ffffff"
    text: "#000000"
    text_secondary: "{neutral.30}"
    accent: "{primary.40}"
    divider: "{neutral.40}"
    warning: "{orange.30}"
    success: "{green.30}"
    syntax_string: "{green.30}"
  dark:
    background: "#000000"
    surface: "{neutral.10}"
    surface_variant: "{neutral.20}"
    text: "#ffffff"
    text_secondary: "{neutral.80}"
    text_disabled: "{neutral.60}"
    text_on_primary: "#000000"
    primary: "{primary.60}"
    primary_hover: "{primary.70}"
    accent: "{cyan.60}"
    divider: "{neutral.60}"
    info: "{cyan.60}"
    state_icon: "{cyan.60}"

entity_colors:
  pinned:
    blue:
      light: "{primary.40}"
      dark: "{primary.50}"

tokens:
  base:
    ha-card-border-width: 2px
  light:
    ha-card-border-color: "{neutral.40}"
  dark:
    ha-card-border-color: "{neutral.60}"
    secondary-text-color: "{neutral.70}"
