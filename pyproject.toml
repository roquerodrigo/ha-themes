[project]
name = "ha-theme-kit"
version = "0.1.0"
description = "Token catalog and theme builder for the Home Assistant frontend"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ha-themes = "ha_theme_kit.cli:main"

[dependency-groups]
dev = ["ruff>=0.13", "pytest>=8.4", "playwright>=1.55"]
dev-server = ["homeassistant==2026.9.4", "home-assistant-frontend==20260826.7"]

[tool.uv]
default-groups = ["dev", "dev-server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_theme_kit"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
